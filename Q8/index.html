<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Nepal Imagemap</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      background-color: #f4f4f4;
    }
    .map-container {
      width: 100%;
      max-width: 1200px; /* Limits size on very large monitors */
    }
    img {
      display: block;
      width: 100%;    /* Makes the image fit the screen width */
      height: auto;   /* Maintains aspect ratio */
      border: none;
    }
  </style>
</head>
<body>

  <div class="map-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Provinces_of_Nepal.png" alt="Provinces of Nepal" usemap="#mymap">
    
    <map name="mymap">
      <area shape="rectangle" coords="1878,861,2240,1334" href="https://koshi.gov.np/" alt="Koshi Pradesh" title="Koshi Pradesh" target="_blank">
      <area shape="circle" coords="1263,757,268" href="https://ppsc.gandaki.gov.np" title="Gandaki Pradesh" target="_blank">
      <area shape="poly" coords="1374,1060,1978,1276,1680,1117,1694,1283" title="Madesh Pradesh" href="https://madhesh.gov.np" target="_blank">
      <area shape="rect" coords="1518,792,1739,1122" title="Bagmati Pradesh" href="https://ocmcm.bagamati.gov.np" target="_blank">
      <area shape="poly" coords="783,820,952,700,1155,1033,649,861" title="Lumbini Pradesh" href="https://ocmcm.lumbini.gov.np/pages/update-portal" target="_blank">
      <area shape="poly" coords="696,419,648,519,627,209,1141,625,918,639,669,756,857,817,621,643,526,625,655,570,628,598,661,676,635,348,714,349,585,305,790,223,1077,445" title="Karnali Pradesh" href="http://karnali.gov.np" target="_blank">
      <area shape="rect" coords="379,191,535,773" title="Sudurpaschim Pradesh" href="https://ocmcm.sudurpashchim.gov.np" target="_blank">
    </map>
  </div>

  <!-- Load the Image Map Resizer script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
  <script>
    // This triggers the magic that recalculates your coordinates
    imageMapResize();
  </script>

</body>
</html>
